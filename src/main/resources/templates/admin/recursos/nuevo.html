<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Añadir recurso</title>
</head>

<body>

<header>

    <h1>Academia de Inglés</h1>

    <a th:href="@{/admin/inicio}">
        Volver al panel
    </a>

    <form th:action="@{/logout}" method="post">
        <button type="submit">
            Cerrar sesión
        </button>
    </form>

</header>


<main>

    <h2>Añadir recurso</h2>



    <section>

        <h3>1. Seleccionar curso</h3>

        <form th:action="@{/admin/recursos/nuevo}"
              method="get">

            <select name="cursoId" required>

                <option value="">
                    Seleccionar curso
                </option>

                <option
                        th:each="curso : ${cursos}"
                        th:value="${curso.id}"
                        th:text="${curso.nivel}"
                        th:selected="${cursoSeleccionado != null
                                     and curso.id == cursoSeleccionado.id}">
                </option>

            </select>

            <button type="submit">
                Continuar
            </button>

        </form>

    </section>



    <section th:if="${cursoSeleccionado != null}">

        <h3>
            2. Añadir recurso al curso
            <span th:text="${cursoSeleccionado.nivel}">
                Curso
            </span>
        </h3>


        <p th:if="${#lists.isEmpty(temas)}">
            Este curso todavía no tiene temas cargados.
        </p>


        <form th:if="${!#lists.isEmpty(temas)}"
              th:action="@{/admin/recursos/nuevo}"
              th:object="${recurso}"
              method="post">

            <div>

                <label for="temaId">
                    Tema
                </label>

                <select
                        id="temaId"
                        name="temaId"
                        required>

                    <option value="">
                        Seleccionar tema
                    </option>

                    <option
                            th:each="tema : ${temas}"
                            th:value="${tema.id}"
                            th:text="${tema.titulo}">
                    </option>

                </select>

            </div>


            <div>

                <label for="tipo">
                    Tipo de recurso
                </label>

                <select
                        id="tipo"
                        th:field="*{tipo}"
                        required>

                    <option value="">
                        Seleccionar tipo
                    </option>

                    <option
                            th:each="tipo : ${tiposRecurso}"
                            th:value="${tipo}"
                            th:text="${tipo}">
                    </option>

                </select>

            </div>


            <div>

                <label for="titulo">
                    Título
                </label>

                <input
                        type="text"
                        id="titulo"
                        th:field="*{titulo}"
                        required
                >

            </div>


            <div>

                <label for="url">
                    URL
                </label>

                <input
                        type="url"
                        id="url"
                        th:field="*{url}"
                        required
                >

            </div>


            <button type="submit">
                Guardar recurso
            </button>

        </form>

    </section>

</main>

</body>

</html>
