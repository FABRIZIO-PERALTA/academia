<!DOCTYPE html>
<html lang="ca"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Veure cursos | Too Cool for School</title>

    <link rel="stylesheet"
          th:href="@{/css/admin-cursos.css}">

</head>

<body>

<header class="main-header">

    <div class="header-content">

        <div class="header-left">

            <img
                    th:src="@{/images/logo.jpeg}"
                    alt="Too Cool for School"
                    class="header-logo">

            <div>

                <h1>Veure cursos</h1>

                <p>Panell d'administració</p>

            </div>

        </div>


        <div class="header-actions">

            <a th:href="@{/admin/inicio}"
               class="back-button">

                Tornar al panell

            </a>


            <form th:action="@{/logout}"
                  method="post">

                <button
                        type="submit"
                        class="logout-button">

                    Tancar sessió

                </button>

            </form>

        </div>

    </div>

</header>


<main class="main-content">

    <section class="courses-section">

        <div class="section-header">

            <h2>Cursos</h2>

            <p>
                Selecciona un curs per consultar
                els seus alumnes i temes.
            </p>

        </div>


        <div class="courses-grid">

            <a
                    th:each="curso : ${cursos}"
                    th:href="@{/admin/cursos/{id}(id=${curso.id})}"
                    class="course-card">

                <div class="course-content">

                    <h3>
                        Curs
                        <span th:text="${curso.nivel}">
                            A1
                        </span>
                    </h3>

                    <p>
                        Veure alumnes i temes
                    </p>

                </div>

                <span class="course-arrow">
                    →
                </span>

            </a>

        </div>

    </section>

</main>

</body>
</html>
