<!DOCTYPE html>
<html lang="ca"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Afegir alumne | Too Cool for School</title>

    <link rel="stylesheet"
          th:href="@{/css/admin-alumno.css}">
</head>

<body>

<!-- =========================================
     HEADER
     ========================================= -->

<header class="main-header">

    <div class="header-content">

        <!-- Logo + título -->

        <div class="header-left">

            <img
                    th:src="@{/images/logo.jpeg}"
                    src="/images/logo.jpeg"
                    alt="Too Cool for School"
                    class="header-logo">

            <div>

                <h1>Afegir alumne</h1>

                <p>Panell d'administració</p>

            </div>

        </div>


        <!-- Botones -->

        <div class="header-actions">

            <a th:href="@{/admin/inicio}"
               class="back-button">

                Tornar al panell

            </a>


            <form th:action="@{/logout}"
                  method="post">

                <button
                        type="submit"
                        class="logout-button">

                    Tancar sessió

                </button>

            </form>

        </div>

    </div>

</header>


<!-- =========================================
     CONTENIDO PRINCIPAL
     ========================================= -->

<main class="main-content">

    <section class="form-card">


        <!-- Título del formulario -->

        <div class="form-header">

            <h2>Nou alumne</h2>

            <p>
                Introdueix les dades de l'alumne i assigna'l
                al curs corresponent.
            </p>

        </div>


        <!-- =================================
             MENSAJE DE ERROR
             ================================= -->

        <div class="error-message"
             th:if="${error != null}">

            <span class="error-icon">
                !
            </span>

            <span th:text="${error}">
                Error
            </span>

        </div>


        <!-- =================================
             FORMULARIO
             ================================= -->

        <form
                th:action="@{/admin/alumnos/nuevo}"
                th:object="${alumno}"
                method="post"
                class="student-form">


            <!-- Nombre -->

            <div class="form-group">

                <label for="nombre">
                    Nom
                </label>

                <input
                        type="text"
                        id="nombre"
                        th:field="*{nombre}"
                        placeholder="Introdueix el nom"
                        required>

            </div>


            <!-- Apellido -->

            <div class="form-group">

                <label for="apellido">
                    Cognoms
                </label>

                <input
                        type="text"
                        id="apellido"
                        th:field="*{apellido}"
                        placeholder="Introdueix els cognoms"
                        required>

            </div>


            <!-- DNI -->

            <div class="form-group">

                <label for="dni">
                    DNI
                </label>

                <input
                        type="text"
                        id="dni"
                        th:field="*{dni}"
                        placeholder="Introdueix el DNI"
                        required>

            </div>


            <!-- Curso -->

            <div class="form-group">

                <label for="cursoId">
                    Curs
                </label>

                <select
                        id="cursoId"
                        name="cursoId"
                        required>

                    <option value="">
                        Selecciona un curs
                    </option>

                    <option
                            th:each="curso : ${cursos}"
                            th:value="${curso.id}"
                            th:text="${curso.nivel}">
                    </option>

                </select>

            </div>


            <!-- Guardar -->

            <button
                    type="submit"
                    class="save-button">

                Desar alumne

            </button>

        </form>

    </section>

</main>

</body>
</html>
