<!DOCTYPE html>
<html lang="ca"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Afegir tema | Too Cool for School</title>

    <link rel="stylesheet"
          th:href="@{/css/admin-tema.css}">

</head>

<body>

<header class="main-header">

    <div class="header-content">

        <div class="header-left">

            <img
                    th:src="@{/images/logo.jpeg}"
                    alt="Too Cool for School"
                    class="header-logo">

            <div>

                <h1>Afegir tema</h1>

                <p>
                    Panell d'administració
                </p>

            </div>

        </div>


        <div class="header-actions">

            <a th:href="@{/admin/inicio}"
               class="back-button">

                Tornar al panell

            </a>


            <form th:action="@{/logout}"
                  method="post">

                <button
                        type="submit"
                        class="logout-button">

                    Tancar sessió

                </button>

            </form>

        </div>

    </div>

</header>


<main class="main-content">

    <section class="form-card">

        <div class="form-header">

            <h2>Nou tema</h2>

            <p>
                Selecciona el curs i introdueix
                les dades del tema.
            </p>

        </div>


        <form
                th:action="@{/admin/temas/nuevo}"
                th:object="${tema}"
                method="post"
                class="tema-form">


            <div class="form-group">

                <label for="cursoId">
                    Curs
                </label>

                <select
                        id="cursoId"
                        name="cursoId"
                        required>

                    <option value="">
                        Selecciona un curs
                    </option>

                    <option
                            th:each="curso : ${cursos}"
                            th:value="${curso.id}"
                            th:text="${curso.nivel}">
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="titulo">
                    Títol
                </label>

                <input
                        type="text"
                        id="titulo"
                        th:field="*{titulo}"
                        placeholder="Introdueix el títol del tema"
                        required>

            </div>


            <div class="form-group">

                <label for="dificultad">
                    Dificultat
                </label>

                <select
                        id="dificultad"
                        th:field="*{dificultad}"
                        required>

                    <option value="">
                        Selecciona una dificultat
                    </option>

                    <option
                            th:each="dificultad : ${dificultades}"
                            th:value="${dificultad}"
                            th:text="${dificultad}">
                    </option>

                </select>

            </div>


            <button
                    type="submit"
                    class="save-button">

                Desar tema

            </button>

        </form>

    </section>

</main>

</body>
</html>
