<!DOCTYPE html>
<html lang="ca"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sessió | Too Cool for School</title>

    <link rel="stylesheet"
          th:href="@{/css/login.css}">
</head>

<body>

<main class="login-page">

    <section class="login-container">

        <!-- Logo de l'acadèmia -->
        <div class="brand">

            <img
                    th:src="@{/images/logo.jpeg}"
                    src="/images/logo.jpeg"
                    alt="Too Cool for School"
                    class="brand-logo">

        </div>


        <!-- Targeta d'inici de sessió -->
        <div class="login-card">

            <h1>Iniciar sessió</h1>

            <p class="login-subtitle">
                Accedeix a la teva aula virtual
            </p>


            <form th:action="@{/login}"
                  method="post"
                  class="login-form">


                <!-- Usuari -->
                <div class="form-group">

                    <label for="username">
                        Usuari
                    </label>

                    <input
                            type="text"
                            id="username"
                            name="username"
                            autocomplete="username"
                            placeholder="Introdueix el teu usuari"
                            required>

                </div>


                <!-- Contrasenya -->
                <div class="form-group">

                    <label for="password">
                        Contrasenya
                    </label>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Introdueix la teva contrasenya"
                            required>

                </div>


                <button
                        type="submit"
                        class="login-button">

                    Iniciar sessió

                </button>

            </form>


            <!-- Error d'autenticació -->
            <div class="message error-message"
                 th:if="${param.error}">

                Usuari o contrasenya incorrectes.

            </div>


            <!-- Registre correcte -->
            <div class="message success-message"
                 th:if="${param.registroExitoso}">

                Compte creat correctament.
                Ja pots iniciar sessió.

            </div>


            <!-- Sessió tancada -->
            <div class="message success-message"
                 th:if="${param.logout}">

                Sessió tancada correctament.

            </div>


            <!-- Registre -->
            <div class="register-section">

                <p>
                    Ets alumne i encara no tens compte?
                </p>

                <a th:href="@{/registro}">
                    Registrar-se
                </a>

            </div>

        </div>

    </section>

</main>

</body>
</html>
