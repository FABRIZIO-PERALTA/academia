<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Academia - Iniciar sesión</title>
</head>

<body>

<h1>Academia de Inglés</h1>

<h2>Iniciar sesión</h2>

<form th:action="@{/login}" method="post">

    <div>
        <label for="username">
            Usuario
        </label>

        <input
                type="text"
                id="username"
                name="username"
                required
        >
    </div>

    <div>
        <label for="password">
            Contraseña
        </label>

        <input
                type="password"
                id="password"
                name="password"
                required
        >
    </div>

    <button type="submit">
        Iniciar sesión
    </button>

</form>

<p th:if="${param.error}">
    Usuario o contraseña incorrectos.
</p>

<p th:if="${param.logout}">
    Sesión cerrada correctamente.
</p>

<p>
    ¿Sos alumno y todavía no tenés cuenta?
    <a th:href="@{/registro}">
        Registrarse
    </a>
</p>

</body>

</html>
