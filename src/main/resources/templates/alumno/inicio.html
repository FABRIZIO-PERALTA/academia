<!DOCTYPE html>
<html lang="ca"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>La meva aula | Too Cool for School</title>

    <link rel="stylesheet"
          th:href="@{/css/alumno-inicio.css}">
</head>

<body>

<!-- =========================================
     CAPÇALERA
     ========================================= -->

<header class="main-header">

    <div class="header-content">

        <!-- Logo + benvinguda -->
        <div class="student-info">

            <img
                    th:src="@{/images/logo.jpeg}"
                    src="/images/logo.jpeg"
                    alt="Too Cool for School"
                    class="header-logo">

            <div class="welcome">

                <h1 th:text="'Hola, ' + ${alumno.nombre} + '!'">
                    Hola!
                </h1>

                <p>
                    Curs:
                    <strong th:text="${curso.nivel}">
                        A1
                    </strong>
                </p>

            </div>

        </div>


        <!-- Tancar sessió -->
        <form th:action="@{/logout}"
              method="post"
              class="logout-form">

            <button
                    type="submit"
                    class="logout-button">

                Tancar sessió

            </button>

        </form>

    </div>

</header>


<!-- =========================================
     CONTINGUT PRINCIPAL
     ========================================= -->

<main class="main-content">

    <section class="topics-section">

        <div class="section-header">

            <h2>Els teus temes</h2>

            <p>
                Selecciona un tema per accedir als seus recursos.
            </p>

        </div>


        <!-- Si no hi ha temes -->
        <div class="empty-message"
             th:if="${#lists.isEmpty(temas)}">

            Encara no hi ha temes disponibles per a aquest curs.

        </div>


        <!-- Graella de temes -->
        <div class="topics-grid"
             th:if="${!#lists.isEmpty(temas)}">

            <a
                    th:each="tema : ${temas}"
                    th:href="@{/alumno/temas/{id}(id=${tema.id})}"
                    class="topic-card">

                <!--
                     Quan afegim imatges als temes,
                     aquesta zona podrà contenir-les.
                -->
                <div class="topic-card-visual">

                    <span class="topic-letter"
                          th:text="${#strings.substring(tema.titulo, 0, 1)}">
                        T
                    </span>

                </div>


                <div class="topic-card-content">

                    <h3 th:text="${tema.titulo}">
                        Nom del tema
                    </h3>

                    <span class="topic-link">
                        Veure recursos →
                    </span>

                </div>

            </a>

        </div>

    </section>

</main>

</body>
</html>
