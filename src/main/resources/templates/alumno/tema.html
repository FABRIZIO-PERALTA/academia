<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${tema.titulo}">Tema</title>
</head>

<body>

<header>

    <a th:href="@{/alumno/inicio}">
        Volver al inicio
    </a>

    <form th:action="@{/logout}" method="post">
        <button type="submit">
            Cerrar sesión
        </button>
    </form>

</header>


<main>

    <h1 th:text="${tema.titulo}">
        Nombre del tema
    </h1>



    <nav>
        <a href="#videos">Videos</a>
        <a href="#actividades">Actividades</a>
        <a href="#juegos">Juegos</a>
    </nav>



    <section id="videos">

        <h2>Videos</h2>

        <p th:if="${#lists.isEmpty(videos)}">
            No hay videos disponibles.
        </p>

        <div th:each="recurso : ${videos}">

            <a th:href="${recurso.url}"
               target="_blank"
               th:text="${recurso.titulo}">
                Video
            </a>

        </div>

    </section>



    <section id="actividades">

        <h2>Actividades</h2>

        <p th:if="${#lists.isEmpty(actividades)}">
            No hay actividades disponibles.
        </p>

        <div th:each="recurso : ${actividades}">

            <a th:href="${recurso.url}"
               target="_blank"
               th:text="${recurso.titulo}">
                Actividad
            </a>

        </div>

    </section>



    <section id="juegos">

        <h2>Juegos</h2>

        <p th:if="${#lists.isEmpty(juegos)}">
            No hay juegos disponibles.
        </p>

        <div th:each="recurso : ${juegos}">

            <a th:href="${recurso.url}"
               target="_blank"
               th:text="${recurso.titulo}">
                Juego
            </a>

        </div>

    </section>

</main>

</body>
</html>
