<!DOCTYPE html>
<html lang="ca"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Detall del curs | Too Cool for School</title>

    <link rel="stylesheet"
          th:href="@{/css/docente-cursos.css}">

</head>

<body>

<header class="main-header">

    <div class="header-content">

        <div class="header-left">

            <img
                    th:src="@{/images/logo.jpeg}"
                    alt="Too Cool for School"
                    class="header-logo">

            <div>

                <h1>
                    Curs
                    <span th:text="${curso.nivel}">
                        A1
                    </span>
                </h1>

                <p>Panell docent</p>

            </div>

        </div>


        <div class="header-actions">

            <a th:href="@{/docente/cursos}"
               class="back-button">

                Tornar als cursos

            </a>


            <a th:href="@{/docente/inicio}"
               class="back-button secondary-back">

                Tornar al panell

            </a>


            <form th:action="@{/logout}"
                  method="post">

                <button
                        type="submit"
                        class="logout-button">

                    Tancar sessió

                </button>

            </form>

        </div>

    </div>

</header>


<main class="main-content">

    <section class="course-detail">

        <div class="course-title">

            <div>

                <h2>
                    Informació del curs
                </h2>

                <p>
                    Consulta els alumnes i els temes
                    associats a aquest curs.
                </p>

            </div>

        </div>


        <div class="detail-grid">


            <section class="detail-card">

                <div class="detail-card-header">

                    <h3>Alumnes</h3>

                    <span class="count-badge"
                          th:text="${#lists.size(alumnos)}">
                        0
                    </span>

                </div>


                <p class="empty-message"
                   th:if="${#lists.isEmpty(alumnos)}">

                    Aquest curs encara no té alumnes.

                </p>


                <ul class="item-list"
                    th:if="${!#lists.isEmpty(alumnos)}">

                    <li th:each="alumno : ${alumnos}">

                        <div class="item-marker"></div>

                        <span>
                            <strong th:text="${alumno.nombre}">
                                Nom
                            </strong>

                            <span th:text="${alumno.apellido}">
                                Cognoms
                            </span>
                        </span>

                    </li>

                </ul>

            </section>


            <section class="detail-card">

                <div class="detail-card-header">

                    <h3>Temes</h3>

                    <span class="count-badge"
                          th:text="${#lists.size(temas)}">
                        0
                    </span>

                </div>


                <p class="empty-message"
                   th:if="${#lists.isEmpty(temas)}">

                    Aquest curs encara no té temes.

                </p>


                <ul class="item-list"
                    th:if="${!#lists.isEmpty(temas)}">

                    <li th:each="tema : ${temas}">

                        <div class="item-marker red"></div>

                        <span th:text="${tema.titulo}">
                            Nom del tema
                        </span>

                    </li>

                </ul>

            </section>

        </div>

    </section>

</main>

</body>
</html>
