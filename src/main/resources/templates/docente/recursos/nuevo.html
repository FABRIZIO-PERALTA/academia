<!DOCTYPE html>
<html lang="ca"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Afegir recurs | Too Cool for School</title>

    <link rel="stylesheet"
          th:href="@{/css/docente-recurso.css}">
</head>

<body>

<header class="main-header">

    <div class="header-content">

        <div class="header-left">

            <img
                    th:src="@{/images/logo.jpeg}"
                    src="/images/logo.jpeg"
                    alt="Too Cool for School"
                    class="header-logo">

            <div>
                <h1>Afegir recurs</h1>
                <p>Panell docent</p>
            </div>

        </div>


        <div class="header-actions">

            <a th:href="@{/docente/inicio}"
               class="back-button">
                Tornar al panell
            </a>


            <form th:action="@{/logout}"
                  method="post">

                <button
                        type="submit"
                        class="logout-button">

                    Tancar sessió

                </button>

            </form>

        </div>

    </div>

</header>


<main class="main-content">

    <section class="form-card">

        <div class="form-header">

            <h2>Nou recurs</h2>

            <p>
                Selecciona primer el curs i després
                afegeix el recurs al tema corresponent.
            </p>

        </div>


        <!-- PAS 1: CURS -->

        <div class="form-step">

            <h3>1. Selecciona el curs</h3>

            <form
                    th:action="@{/docente/recursos/nuevo}"
                    method="get"
                    class="course-form">

                <div class="form-group">

                    <label for="cursoId">
                        Curs
                    </label>

                    <select
                            id="cursoId"
                            name="cursoId"
                            required>

                        <option value="">
                            Selecciona un curs
                        </option>

                        <option
                                th:each="curso : ${cursos}"
                                th:value="${curso.id}"
                                th:text="${curso.nivel}"
                                th:selected="${cursoSeleccionado != null
                                             and curso.id == cursoSeleccionado.id}">
                        </option>

                    </select>

                </div>


                <button
                        type="submit"
                        class="continue-button">

                    Continuar

                </button>

            </form>

        </div>


        <!-- PAS 2: RECURS -->

        <div
                class="form-step resource-step"
                th:if="${cursoSeleccionado != null}">

            <div class="selected-course">

                Curs seleccionat:

                <strong th:text="${cursoSeleccionado.nivel}">
                    A1
                </strong>

            </div>


            <p class="empty-message"
               th:if="${#lists.isEmpty(temas)}">

                Aquest curs encara no té temes disponibles.

            </p>


            <form
                    th:if="${!#lists.isEmpty(temas)}"
                    th:action="@{/docente/recursos/nuevo}"
                    th:object="${recurso}"
                    method="post"
                    class="resource-form">


                <div class="form-group">

                    <label for="temaId">
                        Tema
                    </label>

                    <select
                            id="temaId"
                            name="temaId"
                            required>

                        <option value="">
                            Selecciona un tema
                        </option>

                        <option
                                th:each="tema : ${temas}"
                                th:value="${tema.id}"
                                th:text="${tema.titulo}">
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="tipo">
                        Tipus de recurs
                    </label>

                    <select
                            id="tipo"
                            th:field="*{tipo}"
                            required>

                        <option value="">
                            Selecciona un tipus
                        </option>

                        <option
                                th:each="tipo : ${tiposRecurso}"
                                th:value="${tipo}"
                                th:text="${tipo}">
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="titulo">
                        Títol
                    </label>

                    <input
                            type="text"
                            id="titulo"
                            th:field="*{titulo}"
                            placeholder="Introdueix el títol del recurs"
                            required>

                </div>


                <div class="form-group">

                    <label for="url">
                        URL
                    </label>

                    <input
                            type="url"
                            id="url"
                            th:field="*{url}"
                            placeholder="https://..."
                            required>

                </div>


                <button
                        type="submit"
                        class="save-button">

                    Desar recurs

                </button>

            </form>

        </div>

    </section>

</main>

</body>
</html>
