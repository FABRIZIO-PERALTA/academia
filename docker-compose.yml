services:

  db:
    image: mysql:8.4
    container_name: academia-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: academia
      MYSQL_USER: academia_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - academia_db_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: academia-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://db:3306/academia
      DB_USERNAME: academia_app
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: update
      SHOW_SQL: "false"
      FORMAT_SQL: "false"
      SERVER_PORT: 8080

    ports:
      - "8080:8080"

volumes:
  academia_db_data: